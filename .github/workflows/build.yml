name: Compilar Homebrew Xbox 360

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código-fonte
      uses: actions/checkout@v4

    - name: Configurar ferramentas de compilação
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Executar CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Salvar arquivos gerados
      uses: actions/upload-artifact@v4
      with:
        name: xbox-homebrew-output
        path: build/
